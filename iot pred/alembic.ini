# Alembic Configuration File
# This file is used by Alembic to configure database migrations

[alembic]
# Path to migration scripts
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/iot_db
script_location = alembic

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
